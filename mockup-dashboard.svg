  <path d="M204 43h11M204 49h11M204 55h11" stroke="#527083" stroke-width="2" stroke-linecap="round"/>

  <text x="30" y="116" class="sans muted tiny" font-weight="750">WORKSPACE</text>

  <!-- nav active -->
  <rect x="18" y="132" width="210" height="46" rx="12" fill="#E8F8F5"/>
  <circle cx="43" cy="155" r="10" fill="#18B7A0"/>
  <path d="M38 155l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
