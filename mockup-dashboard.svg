  <text x="1177" y="482" class="sans ink" font-size="27" font-weight="800">68%</text><text x="1175" y="505" class="sans muted" font-size="11">on track</text>
  <g class="sans" font-size="12"><circle cx="1039" cy="592" r="5" fill="#18B7A0"/><text x="1052" y="596" class="muted">Completed</text><text x="1335" y="596" class="ink" text-anchor="end" font-weight="750">68%</text><circle cx="1039" cy="620" r="5" fill="#2D79D8"/><text x="1052" y="624" class="muted">Processing</text><text x="1335" y="624" class="ink" text-anchor="end" font-weight="750">21%</text><circle cx="1039" cy="648" r="5" fill="#E49A24"/><text x="1052" y="652" class="muted">Needs attention</text><text x="1335" y="652" class="ink" text-anchor="end" font-weight="750">11%</text></g>

  <!-- bottom strip -->
  <text x="282" y="738" class="sans ink" font-size="15" font-weight="750">Recent activity</text><text x="1298" y="738" class="sans" fill="#128B7B" font-size="12" font-weight="750">View queue →</text>
  <rect x="282" y="758" width="1120" height="80" rx="14" fill="#FFFFFF" stroke="#E6EDF0"/>
  <circle cx="316" cy="798" r="18" fill="#E8F8F5"/><path d="M309 798h14M316 791v14" stroke="#18B7A0" stroke-width="2" stroke-linecap="round"/>
  <text x="350" y="792" class="sans ink" font-size="13" font-weight="700">Inbound shipment received</text><text x="350" y="813" class="sans muted" font-size="12">PO-10428 · Dock 03 · 12 minutes ago</text>
  <rect x="1205" y="784" width="80" height="28" rx="8" fill="#E8F8F5"/><text x="1245" y="802" class="sans" text-anchor="middle" fill="#128B7B" font-size="11" font-weight="750">Complete</text>
  <line x1="1090" y1="773" x2="1090" y2="823" stroke="#E6EDF0"/><text x="1118" y="793" class="sans muted" font-size="11">Owner</text><text x="1118" y="812" class="sans ink" font-size="12" font-weight="700">A. Mensah</text>
