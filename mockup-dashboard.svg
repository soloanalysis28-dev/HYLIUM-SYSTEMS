    <text x="308" y="226" class="ink metric">128</text><text x="308" y="255" class="muted body">incoming orders</text><text x="462" y="255" fill="#18A893" font-size="12" font-weight="750">+8.4%</text>
    <text x="584" y="184" class="muted tiny" font-weight="800">DISPATCH</text><circle cx="777" cy="181" r="16" fill="#EDF3FC"/><path d="M770 181h12M778 175l5 6-5 6" fill="none" stroke="#2D79D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
