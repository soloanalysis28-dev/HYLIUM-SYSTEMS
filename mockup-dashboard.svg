  <g stroke="#EAF0F2" stroke-width="1"><line x1="330" y1="438" x2="940" y2="438"/><line x1="330" y1="486" x2="940" y2="486"/><line x1="330" y1="534" x2="940" y2="534"/><line x1="330" y1="582" x2="940" y2="582"/></g>
  <g class="sans muted" font-size="11"><text x="300" y="442">160</text><text x="300" y="490">120</text><text x="305" y="538">80</text><text x="305" y="586">40</text><text x="334" y="619">Mon</text><text x="430" y="619">Tue</text><text x="526" y="619">Wed</text><text x="622" y="619">Thu</text><text x="718" y="619">Fri</text><text x="814" y="619">Sat</text><text x="910" y="619">Sun</text></g>
  <path d="M340 568 C378 555 405 528 436 540 S493 500 532 514 S588 478 628 492 S683 450 724 469 S782 432 820 448 S875 414 930 427" fill="none" stroke="url(#chart)" stroke-width="4" stroke-linecap="round"/>
