  <circle cx="1205" cy="487" r="82" fill="none" stroke="#EEF2F3" stroke-width="26"/>
  <path d="M1205 405 A82 82 0 0 1 1277 526" fill="none" stroke="#18B7A0" stroke-width="26" stroke-linecap="round"/>
