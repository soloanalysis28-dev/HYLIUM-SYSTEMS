  <g filter="url(#shadow)">
    <rect x="282" y="154" width="254" height="140" rx="16" fill="#FFFFFF"/>
    <rect x="558" y="154" width="254" height="140" rx="16" fill="#FFFFFF"/>
    <rect x="834" y="154" width="254" height="140" rx="16" fill="#FFFFFF"/>
