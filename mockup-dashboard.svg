<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18B7A0"/>
      <stop offset="1" stop-color="#1289A5"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18B7A0"/>
      <stop offset="1" stop-color="#2D79D8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15324A" flood-opacity=".08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .ink { fill: #17324A; }
      .muted { fill: #7B8C9D; }
      .tiny { font-size: 12px; letter-spacing: .04em; }
      .label { font-size: 13px; font-weight: 650; }
      .body { font-size: 15px; }
      .metric { font-size: 28px; font-weight: 750; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1440" height="900" fill="#F4F7F8"/>
  <rect x="0" y="0" width="246" height="900" fill="#FFFFFF"/>
  <rect x="245" y="0" width="1" height="900" fill="#E6EDF0"/>

  <!-- brand / sidebar -->
