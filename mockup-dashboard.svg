    <text x="860" y="184" class="muted tiny" font-weight="800">STOCKS</text><circle cx="1053" cy="181" r="16" fill="#FFF5DE"/><path d="M1047 181h12M1053 175v12" stroke="#E49A24" stroke-width="2" stroke-linecap="round"/>
    <text x="860" y="226" class="ink metric">84%</text><text x="860" y="255" class="muted body">capacity in use</text><text x="1010" y="255" fill="#E49A24" font-size="12" font-weight="750">Monitor</text>
    <text x="1136" y="184" class="muted tiny" font-weight="800">REPORTS</text><circle cx="1367" cy="181" r="16" fill="#F0EBFA"/><path d="M1361 174h12v14h-12zM1364 178h6M1364 182h6" fill="none" stroke="#7757B5" stroke-width="1.7"/>
    <text x="1136" y="226" class="ink metric">24</text><text x="1136" y="255" class="muted body">ready to review</text><text x="1281" y="255" fill="#7757B5" font-size="12" font-weight="750">View all</text>
  </g>

