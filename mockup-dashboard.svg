  <path d="M43 49c0-7 5-12 12-12 6 0 11 5 11 12 0 6-5 11-11 11-7 0-12-5-12-11Zm7 0c0 3 2 5 5 5 3 0 5-2 5-5 0-3-2-5-5-5-3 0-5 2-5 5Z" fill="#fff"/>
  <text x="84" y="47" class="sans ink" font-size="18" font-weight="800">HYLIUM</text>
  <text x="84" y="64" class="sans muted" font-size="10" font-weight="650" letter-spacing=".16em">SYSTEMS</text>

